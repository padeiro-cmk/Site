<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um cantinho nosso ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Pacifico&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #2b071b, #811b45, #e44c78);
    color: white;
    position: relative;
}

/* CORACOES DESFOCADOS NO FUNDO */
.hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.heart {
    position: absolute;
    bottom: -100px;
    color: rgba(255, 220, 235, 0.45);
    animation: subir linear infinite;
    filter: blur(2px);
    user-select: none;
}

.heart:nth-child(1) { left: 5%; font-size: 55px; animation-duration: 13s; }
.heart:nth-child(2) { left: 18%; font-size: 30px; animation-duration: 17s; animation-delay: 2s; }
.heart:nth-child(3) { left: 32%; font-size: 75px; animation-duration: 19s; animation-delay: 4s; filter: blur(5px); }
.heart:nth-child(4) { left: 48%; font-size: 40px; animation-duration: 14s; animation-delay: 1s; }
.heart:nth-child(5) { left: 65%; font-size: 65px; animation-duration: 18s; animation-delay: 3s; filter: blur(4px); }
.heart:nth-child(6) { left: 80%; font-size: 35px; animation-duration: 12s; animation-delay: 5s; }
.heart:nth-child(7) { left: 92%; font-size: 70px; animation-duration: 20s; animation-delay: 2s; filter: blur(5px); }
.heart:nth-child(8) { left: 42%; font-size: 25px; animation-duration: 15s; animation-delay: 7s; }

@keyframes subir {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    15% { opacity: 0.7; }
    85% { opacity: 0.5; }
    100% { transform: translateY(-120vh) rotate(35deg); opacity: 0; }
}

/* CARTAO DO LOGIN */
.container {
    position: relative;
    z-index: 1;
    width: 90%;
    max-width: 390px;
    padding: 38px 28px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 15px 50px rgba(30, 0, 15, 0.35);
    animation: aparecer 1s ease;
}

@keyframes aparecer {
    from { opacity: 0; transform: translateY(25px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.logo {
    font-size: 48px;
    margin-bottom: 12px;
    animation: pulsar 2s infinite;
}

@keyframes pulsar {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
}

h1 {
    font-family: 'Pacifico', cursive;
    font-size: 29px;
    font-weight: 400;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 13px;
    color: #ffe0eb;
    margin-bottom: 28px;
    line-height: 1.7;
}

.input-group {
    text-align: left;
    margin-bottom: 17px;
}

label {
    display: block;
    font-size: 12px;
    margin: 0 0 7px 4px;
    color: #ffe4ed;
}

input {
    width: 100%;
    padding: 14px 15px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.25);
    outline: none;
    background: rgba(255,255,255,0.12);
    color: white;
    font-family: inherit;
    font-size: 14px;
    transition: 0.3s;
}

input::placeholder { color: rgba(255,255,255,0.6); }

input:focus {
    border-color: #ffb6d0;
    background: rgba(255,255,255,0.18);
    box-shadow: 0 0 0 3px rgba(255, 182, 208, 0.12);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #ffb4cf, #ff6b9b);
    color: #681331;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 20px rgba(255, 80, 140, 0.25);
}

button:active { transform: scale(0.97); }
button:hover { filter: brightness(1.08); transform: translateY(-2px); }

.message {
    min-height: 22px;
    margin-top: 15px;
    font-size: 12px;
    color: #ffe1eb;
}

.footer {
    margin-top: 22px;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
}

@media (max-width: 400px) {
    .container { padding: 32px 22px; }
    h1 { font-size: 26px; }
}
</style>
</head>

<body>

<div class="hearts" aria-hidden="true">
    <span class="heart">♥</span>
    <span class="heart">♡</span>
    <span class="heart">♥</span>
    <span class="heart">♡</span>
    <span class="heart">♥</span>
    <span class="heart">♡</span>
    <span class="heart">♥</span>
    <span class="heart">♥</span>
</div>

<main class="container">
    <div class="logo">💗</div>

    <h1>Oi, meu amor!</h1>

    <p class="subtitle">
        Preparei um cantinho especial<br>
        só pra você, Nati. ♡
    </p>

    <form id="loginForm">
        <div class="input-group">
            <label for="usuario">Seu usuário 💌</label>
            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário..."
                autocomplete="username"
                required
            >
        </div>

        <div class="input-group">
            <label for="senha">Sua senha 🔐</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha..."
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit">Entrar, meu amor ♡</button>
        <p class="message" id="mensagem" role="status"></p>
    </form>

    <div class="footer">
        feito com amor, especialmente pra você ♥
    </div>
</main>

<script>
const formulario = document.getElementById("loginForm");
const mensagem = document.getElementById("mensagem");

formulario.addEventListener("submit", function(event) {
    event.preventDefault();

    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value;

    if (usuario === "natinati" && senha === "natinati") {
        // Abre a segunda pagina, que deve estar na mesma pasta.
        window.location.href = "inicio.html";
    } else {
        mensagem.textContent = "Ops! Usuário ou senha incorretos, amorzinho 💔";
        document.getElementById("senha").value = "";
    }
});
</script>

</body>
</html>
